name: Calendar subscription helper tests

on:
  push:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/calendar-subscriptions-tests.yml"
      - "js/**"
      - "css/**"
      - "index.html"
      - "sw.js"
      - "tests/**"
  pull_request:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/calendar-subscriptions-tests.yml"
      - "js/**"
      - "css/**"
      - "index.html"
      - "sw.js"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser module syntax
        run: |
          for file in js/*.js; do
            node --experimental-default-type=module --check "$file"
          done
      - name: Test calendar and task logic
        run: TZ=Europe/Moscow node --experimental-default-type=module --test tests/logic.test.mjs
      - name: Test URL validation and URL encryption
        run: >-
          deno test --allow-env
          supabase/functions/_shared/calendar-url.test.ts
          supabase/functions/_shared/calendar-sync.test.ts
      - name: Type-check calendar Edge Functions
        run: >-
          deno check
          supabase/functions/calendar-subscriptions/index.ts
          supabase/functions/sync-calendar-subscriptions/index.ts
